name: Android build

# Builds an installable test APK of the mobile app on GitHub's servers.
# Download it from the run's "Artifacts" section, copy it to an Android phone and open it
# (allow "Install unknown apps" once). Run it by hand from the Actions tab, or it runs
# automatically when the mobile app or shared package changes on main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Both values are public by design (the publishable key is shipped inside every app).
      EXPO_PUBLIC_SUPABASE_URL: https://vqbtnftnxyfaembwgfrk.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hUmIPBSPHChcDJIfkOYc7w__-l-QfQD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate icons and native Android project
        working-directory: apps/mobile
        run: |
          npm run icons
          npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        # Real phones only (no emulator builds) to keep the APK small and the build fast.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/tillmate-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tillmate-android-apk
          path: dist/*.apk
          retention-days: 30
