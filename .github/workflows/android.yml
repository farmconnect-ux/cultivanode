name: Android build

# Builds an installable signed release APK of the mobile app on GitHub's servers.
# Automatically publishes latest release to farmconnect-ux/cultivanode-android for farmer downloads.
# Also keeps build artifact in GitHub Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://vqbtnftnxyfaembwgfrk.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hUmIPBSPHChcDJIfkOYc7w__-l-QfQD
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate icons and native Android project
        working-directory: apps/mobile
        run: |
          npm run icons
          npx expo prebuild -p android --no-install

      - name: Configure release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile/android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.keystore

            # Test keystore access with keytool before running long Gradle build
            CLEAN_STORE_PASS=$(echo -n "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
            CLEAN_KEY_ALIAS=$(echo -n "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
            echo "Verifying keystore credentials with keytool..."
            keytool -list -v -keystore app/release.keystore -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_KEY_ALIAS" || {
              echo "::error::Keystore verification failed! Please check that ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS match the keystore."
              exit 1
            }

            # Patch app/build.gradle to configure release signing via project properties
            node -e '
              const fs = require("fs");
              const file = "app/build.gradle";
              let content = fs.readFileSync(file, "utf8");

              const signingBlock = `
                      release {
                          storeFile file("release.keystore")
                          storePassword project.findProperty("MY_STORE_PASS") ?: ""
                          keyAlias project.findProperty("MY_KEY_ALIAS") ?: ""
                          keyPassword project.findProperty("MY_KEY_PASS") ?: ""
                      }
              `;

              content = content.replace("signingConfigs {", "signingConfigs {" + signingBlock);
              content = content.replace(/signingConfig signingConfigs\.debug/g, "signingConfig signingConfigs.release");
              fs.writeFileSync(file, content);
            '
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          CLEAN_STORE_PASS=$(echo -n "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_ALIAS=$(echo -n "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(echo -n "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')

          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -PMY_STORE_PASS="$CLEAN_STORE_PASS" \
            -PMY_KEY_ALIAS="$CLEAN_KEY_ALIAS" \
            -PMY_KEY_PASS="$CLEAN_KEY_PASS"

      - name: Package and verify the APK
        run: |
          mkdir -p dist
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK_PATH" "dist/cultivanode.apk"
          cp "$APK_PATH" "dist/cultivanode-v0.1.0-${{ github.run_number }}.apk"

          # Verify signature with Android SDK apksigner
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose dist/cultivanode.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: cultivanode-android-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish latest release to public download repo
        if: ${{ env.RELEASES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="v0.1.0-build.${{ github.run_number }}"
          echo "Publishing release $TAG to farmconnect-ux/cultivanode-android..."

          gh release create "$TAG" \
            --repo farmconnect-ux/cultivanode-android \
            --title "CultivaNode Android $TAG" \
            --notes "Official release build of CultivaNode Android app ($TAG). Direct installable APK for farmers in Nigeria." \
            --latest \
            dist/cultivanode.apk
