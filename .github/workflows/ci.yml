name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  apps:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Uses the lockfile once it is committed; falls back to a fresh install before that.
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies all migrations)
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db
