name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  apps:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Uses the lockfile once it is committed; falls back to a fresh install before that.
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies all migrations)
        # The default registry (public.ecr.aws) rate-limits shared CI runners ("toomanyrequests").
        # Pull from GitHub's registry first, then Docker Hub, retrying once each.
        run: |
          for registry in ghcr.io ghcr.io docker.io docker.io; do
            if SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry supabase db start; then exit 0; fi
            echo "supabase db start failed with $registry, retrying"
            supabase stop --no-backup || true
            sleep 15
          done
          exit 1
      - name: Run pgTAP tests
        run: supabase test db
