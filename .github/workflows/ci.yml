name: CI

on:
  pull_request:
  push:
    branches: [main, stabilization/batch-02-platform-stability]

jobs:
  apps:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies all migrations)
        # The default registry (public.ecr.aws) rate-limits shared CI runners ("toomanyrequests").
        # Pull from GitHub's registry first, then Docker Hub, retrying once each.
        run: |
          for registry in ghcr.io ghcr.io docker.io docker.io; do
            if SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry supabase start -x studio,inbucket,logflare,vector,analytics,pgadmin,imgproxy,edge-runtime,realtime; then exit 0; fi
            echo "supabase start failed with $registry, retrying"
            supabase stop --no-backup || true
            sleep 15
          done
          exit 1
      - name: Run pgTAP tests
        run: supabase test db

      - name: Run database concurrency tests
        run: node supabase/tests/concurrency-check.mjs

      - name: Run Storage API integration tests
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          node supabase/tests/storage-api-check.mjs
